<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlackWall | Threat Intelligence | (OSINT)</title>
<style>
:root {
  /* Default (Cyberpunk) */
  --bg-color: #000;
  --text-color: #0ff;
  --matrix-color: #0ff;
  --heading-color: #6f6;
  --value-color: #afa;
  --highlight-color: #0ff;
  --alert-color: #f66;
  --button-bg: #0ff;
  --button-text: #060;
  --panel-bg: rgba(0,0,0,0.7);
  --card-bg: rgba(0,0,0,0.8);
  --header-bg: #000;
  --note-color: #6f6;
  --search-bg: #111;
  --search-text: #0ff;
  --search-placeholder: #888;
}
body {margin:0; font-family:'Courier New', monospace; background:var(--bg-color); color:var(--text-color); overflow-x:hidden;}
canvas#matrix {position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; pointer-events:none;}
.container {max-width:1200px; margin:20px auto; padding:10px; position:relative; z-index:1;}
h1 {color:var(--text-color); text-align:center; font-size:2em; text-shadow:0 0 5px var(--text-color),0 0 10px var(--text-color);}
#search-container {display:flex; flex-wrap:wrap; gap:10px; margin-bottom:10px; align-items:center;}
#search-box {flex:1; padding:10px; font-size:1em; background:var(--search-bg); border:1px solid var(--text-color); color:var(--search-text);}
#search-box::placeholder {color: var(--search-placeholder);}
button {background:var(--button-bg); color:var(--button-text); border:none; padding:5px 10px; cursor:pointer; font-weight:bold; border-radius:3px;}
#theme-button {position:relative;}
#theme-dropdown {display:none; position:absolute; top:100%; left:0; background:var(--panel-bg); border:1px solid var(--text-color); border-radius:3px; z-index:2;}
#theme-dropdown button {display:block; width:100%; text-align:left; margin:0; border:none; border-bottom:1px solid var(--text-color); border-radius:0;}
#feed-note {color:var(--note-color); font-size:0.9em; margin-bottom:10px; text-align:center;}
#search-status {text-align:center; color:var(--alert-color); font-weight:bold; margin-bottom:10px; display:none;}
.feed-panel {margin-bottom:20px; border:1px solid var(--text-color); border-radius:5px; overflow:hidden; background:var(--panel-bg); box-shadow:0 0 10px var(--text-color);}
.feed-header {padding:10px; background:var(--header-bg); cursor:pointer; font-weight:bold; font-size:1.2em; text-shadow:0 0 5px var(--text-color);}
.feed-entries {display:none; padding:10px; max-height:500px; overflow-y:auto;}
.entry-card {background:var(--card-bg); border:1px solid var(--text-color); padding:10px; margin-bottom:10px; border-radius:5px; transition:0.3s;}
.entry-card:hover {box-shadow:0 0 10px var(--text-color); transform:scale(1.02);}
.entry-title {font-size:1.1em; font-weight:bold; color:var(--heading-color); text-decoration:none;}
.heading {color:var(--heading-color); font-weight:bold; margin-top:6px;}
.value {color:var(--value-color); margin-left:5px;}
mark.highlight {background-color:var(--highlight-color); color:#000;}
::selection {background:var(--highlight-color); color:#000;}
.feed-entries::-webkit-scrollbar {width:8px;}
.feed-entries::-webkit-scrollbar-thumb {background:var(--matrix-color); border-radius:4px;}
</style>
</head>
<body>
<canvas id="matrix"></canvas>

<div class="container">
  <h1>BlackWall | Threat Intelligence | (OSINT)</h1>
  <div id="search-container">
    <button id="last-24h">Last 24 Hours</button>
    <button id="archive">Archive</button>
    <input type="text" id="search-box" placeholder="Search feeds...">
    <button id="search-submit">Search</button>
    <button id="clear-search">Clear</button>
    <div id="theme-button">
      <button id="theme-current">Theme: Cyberpunk ▼</button>
      <div id="theme-dropdown">
        <button data-theme="default">Cyberpunk</button>
        <button data-theme="corporate-dark">Corporate Dark</button>
        <button data-theme="corporate-light">Corporate Light</button>
      </div>
    </div>
  </div>

  <div id="button-bar" style="display:flex; gap:10px; margin-bottom:10px;">
    <button id="expand-all">Expand All</button>
    <button id="collapse-all">Collapse All</button>
  </div>

  <div id="feed-note">Titles can be clicked to view the source</div>
  <div id="search-status">No matches found</div>
  <div id="feeds-container"></div>
</div>

<script>
// ================= MATRIX EFFECT =================
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;
const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()*&^%'.split('');
const fontSize = 18;
const columns = Math.floor(width / fontSize);
const drops = Array(columns).fill(0);
let matrixColor = getComputedStyle(document.documentElement).getPropertyValue('--matrix-color').trim();

function drawMatrix() {
  const themeName = themeButton.dataset.currentTheme || 'default';
  if(themeName === 'default'){
    ctx.fillStyle = 'rgba(0,0,0,0.05)';
    ctx.fillRect(0,0,width,height);
    matrixColor = getComputedStyle(document.documentElement).getPropertyValue('--matrix-color').trim();
    ctx.fillStyle = matrixColor;
    ctx.font = fontSize + 'px monospace';
    for(let i=0;i<drops.length;i++){
      const text = letters[Math.floor(Math.random() * letters.length)];
      ctx.fillText(text,i*fontSize,drops[i]*fontSize);
      if(drops[i]*fontSize>height && Math.random()>0.975) drops[i]=0;
      drops[i]++;
    }
  } else {
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bg-color').trim();
    ctx.fillRect(0,0,width,height);
  }
}
setInterval(drawMatrix,50);
window.addEventListener('resize',()=>{width=canvas.width=window.innerWidth;height=canvas.height=window.innerHeight;});

// ================= FEEDS & SEARCH LOGIC =================
const container = document.getElementById('feeds-container');
const searchBox = document.getElementById('search-box');

const feeds = {
  "Bleeping Computer": "bleeping.json",
  "The Hacker News": "hackernews.json",
  "CISA Advisories": "cisa.json",
  "Mandiant Reports": "mandiant.json",
  "Ransomware Live": "ransomware_live.json",
  "MITRE ATT&CK Actors": "mitre.json"
};

function addField(card,label,value){
  if(!value) return;
  const h=document.createElement('div'); h.className='heading'; h.textContent=label; card.appendChild(h);
  const v=document.createElement('div'); v.className='value'; v.textContent=value; card.appendChild(v);
}

async function loadFeedData(data, feedName){
  const panel=document.createElement('div'); panel.className='feed-panel';
  const header=document.createElement('div'); header.className='feed-header'; header.textContent=`${feedName} (${data.length})`;
  panel.appendChild(header);
  const entriesDiv=document.createElement('div'); entriesDiv.className='feed-entries';
  header.onclick=()=>{entriesDiv.style.display=entriesDiv.style.display==='block'?'none':'block';};

  data.forEach(entry=>{
    const card=document.createElement('div'); card.className='entry-card';
    const title=document.createElement('a'); title.className='entry-title'; title.href=entry.link||entry.mitre_url||'#'; title.target='_blank';
    title.textContent=entry.title||entry.actor_name||'No title'; card.appendChild(title);
    const pub=entry.published||entry.last_updated;
    if(pub) addField(card,'Published (UTC):',new Date(pub).toISOString().replace('T',' ').split('.')[0]+'Z');
    let summary=entry.summary||entry.description; if(summary) summary=summary.replace(/\.\.\.$/,''); if(summary)addField(card,'Summary:',summary);
    if(entry.aliases)addField(card,'Aliases:',entry.aliases);
    if(entry.techniques)addField(card,'Techniques:',entry.techniques);
    if(entry.attribution)addField(card,'Attribution:',entry.attribution);
    if(entry.country)addField(card,'Country:',entry.country);
    if(entry.website)addField(card,'Website:',entry.website);
    entriesDiv.appendChild(card);
  });
  panel.appendChild(entriesDiv); container.appendChild(panel);
}

async function load24h(){
  container.innerHTML='';
  for(const [name,file] of Object.entries(feeds)){
    try{
      const res=await fetch(file); const data=await res.json();
      await loadFeedData(data,name);
    }catch(e){console.error(file,e);}
  }
}

async function loadArchive(){
  container.innerHTML='';
  try{
    const res = await fetch('archives_index.json');
    const archives = await res.json();
    for(const [feedKey, files] of Object.entries(archives)){
      let merged = [];
      const seen = new Set();
      for(const file of files){
        const resFile = await fetch(file);
        const text = await resFile.text();
        const data = text.split(/\r?\n/).filter(Boolean).map(line=>JSON.parse(line));
        for(const entry of data){
          const key = (entry.title||entry.actor_name||'') + '|' + (entry.link||entry.mitre_url||'');
          if(!seen.has(key)){ merged.push(entry); seen.add(key); }
        }
      }
      await loadFeedData(merged, feedKey.charAt(0).toUpperCase() + feedKey.slice(1) + ' Archive');
    }
  }catch(e){console.error('Failed loading archives', e);}
}

// BUTTONS
document.getElementById('last-24h').addEventListener('click',load24h);
document.getElementById('archive').addEventListener('click',loadArchive);
document.getElementById('expand-all').addEventListener('click',()=>{document.querySelectorAll('.feed-entries').forEach(d=>d.style.display='block');});
document.getElementById('collapse-all').addEventListener('click',()=>{document.querySelectorAll('.feed-entries').forEach(d=>d.style.display='none');});

// SEARCH
async function searchFeeds(){
  const query=searchBox.value.trim().toLowerCase();
  if(!query)return load24h();
  const panels = document.querySelectorAll('.feed-panel');
  let anyMatch=false;
  panels.forEach(panel=>{
    const entriesDiv = panel.querySelector('.feed-entries');
    let panelHasMatch=false;
    entriesDiv.querySelectorAll('.entry-card').forEach(card=>{
      const text = card.textContent.toLowerCase();
      const isMatch = text.includes(query);
      card.style.display = isMatch?'block':'none';
      if(isMatch) panelHasMatch=true;
    });
    entriesDiv.style.display = panelHasMatch?'block':'none';
    if(panelHasMatch) anyMatch=true;
  });
  document.getElementById('search-status').style.display = anyMatch?'none':'block';
}
document.getElementById('search-submit').addEventListener('click',searchFeeds);
searchBox.addEventListener('keydown',e=>{if(e.key==='Enter') searchFeeds();});
document.getElementById('clear-search').addEventListener('click',()=>{searchBox.value='';searchFeeds();});

// THEME SWITCHER
const themeButton = document.getElementById('theme-current');
const themeDropdown = document.getElementById('theme-dropdown');

themeButton.dataset.currentTheme = 'default'; // default Cyberpunk

themeButton.addEventListener('click',()=>{themeDropdown.style.display = themeDropdown.style.display==='block'?'none':'block';});
themeDropdown.querySelectorAll('button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const selected = btn.getAttribute('data-theme');
    applyTheme(selected);
    themeDropdown.style.display='none';
  });
});

const themes = {
  "default": {
    "--bg-color": "#000",
    "--text-color": "#0ff",
    "--matrix-color": "#0ff",
    "--heading-color": "#6f6",
    "--value-color": "#afa",
    "--highlight-color": "#0ff",
    "--alert-color": "#f66",
    "--button-bg": "#0ff",
    "--button-text": "#060",
    "--panel-bg": "rgba(0,0,0,0.7)",
    "--card-bg": "rgba(0,0,0,0.8)",
    "--header-bg": "#000",
    "--note-color": "#6f6",
    "--search-bg": "#111",
    "--search-text": "#0ff",
    "--search-placeholder": "#888"
  },
  "corporate-dark": {
    "--bg-color": "#000",
    "--text-color": "#e6e6e6",
    "--matrix-color": "#000",
    "--heading-color": "#ccc",
    "--value-color": "#999",
    "--highlight-color": "#ffcc00",
    "--alert-color": "#f66",
    "--button-bg": "#222",
    "--button-text": "#e6e6e6",
    "--panel-bg": "#111",
    "--card-bg": "#111",
    "--header-bg": "#222",
    "--note-color": "#ccc",
    "--search-bg": "#222",
    "--search-text": "#e6e6e6",
    "--search-placeholder": "#999"
  },
  "corporate-light": {
    "--bg-color": "#e6e6e6",
    "--text-color": "#222222",
    "--matrix-color": "#555555",
    "--heading-color": "#444444",
    "--value-color": "#666666",
    "--highlight-color": "#ffcc00",
    "--alert-color": "#f66",
    "--button-bg": "#ddd",
    "--button-text": "#222222",
    "--panel-bg": "#d9d9d9",
    "--card-bg": "#e6e6e6",
    "--header-bg": "#ddd",
    "--note-color": "#444444",
    "--search-bg": "#e6e6e6",
    "--search-text": "#222222",
    "--search-placeholder": "#888888"
  }
};

function applyTheme(name){
  const theme = themes[name];
  for(let prop in theme) document.documentElement.style.setProperty(prop, theme[prop]);
  matrixColor = getComputedStyle(document.documentElement).getPropertyValue('--matrix-color').trim();
  themeButton.textContent = 'Theme: ' + (name==='default'?'Cyberpunk':name==='corporate-dark'?'Corporate Dark':'Corporate Light') + ' ▼';
  themeButton.dataset.currentTheme = name;
}

applyTheme('default'); // init Cyberpunk
load24h();
</script>
</body>
</html>

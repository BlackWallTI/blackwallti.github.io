<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlackWall | Threat Intelligence | (OSINT)</title>
<style>
:root {
  --bg-color: #000;
  --text-color: #0ff;
  --matrix-color: #0ff;
  --heading-color: #6f6;
  --value-color: #afa;
  --highlight-color: #0ff;
  --alert-color: #f66;
  --button-bg: #0ff;
  --button-text: #060;
  --input-bg: #111;
  --input-text: #0ff;
  --note-color: #6f6;
}
body {
  margin:0;
  font-family:'Courier New', monospace;
  background:var(--bg-color);
  color:var(--text-color);
  overflow-x:hidden;
}
canvas#matrix {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  z-index:-1;
  pointer-events:none;
}
.container {
  max-width:1200px;
  margin:20px auto;
  padding:10px;
  position:relative;
  z-index:1;
}
h1 {
  color:var(--text-color);
  text-align:center;
  font-size:2em;
  text-shadow:0 0 5px var(--text-color),0 0 10px var(--text-color);
}
#search-container {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:10px;
  align-items:center;
}
#search-box {
  flex:1;
  padding:10px;
  font-size:1em;
  background:var(--input-bg);
  border:1px solid var(--text-color);
  color:var(--input-text);
}
button, #theme-button {
  background:var(--button-bg);
  color:var(--button-text);
  border:none;
  padding:5px 10px;
  cursor:pointer;
  font-weight:bold;
  border-radius:3px;
}
#theme-dropdown {
  position:absolute;
  display:none;
  margin-top:5px;
  padding:5px;
  border:1px solid var(--text-color);
  border-radius:3px;
  background:var(--bg-color);
  color:var(--text-color);
}
#feed-note {
  color:var(--note-color);
  font-size:0.9em;
  margin-bottom:10px;
  text-align:center;
}
#search-status {
  text-align:center;
  color:var(--alert-color);
  font-weight:bold;
  margin-bottom:10px;
  display:none;
}
.feed-panel {
  margin-bottom:20px;
  border:1px solid var(--text-color);
  border-radius:5px;
  overflow:hidden;
  background:rgba(0,0,0,0.7);
  box-shadow:0 0 10px var(--text-color);
}
.feed-header {
  padding:10px;
  background:var(--bg-color);
  cursor:pointer;
  font-weight:bold;
  font-size:1.2em;
  text-shadow:0 0 5px var(--text-color);
}
.feed-entries {
  display:none;
  padding:10px;
  max-height:500px;
  overflow-y:auto;
}
.entry-card {
  background:rgba(0,0,0,0.8);
  border:1px solid var(--text-color);
  padding:10px;
  margin-bottom:10px;
  border-radius:5px;
  transition:0.3s;
}
.entry-card:hover {
  box-shadow:0 0 10px var(--text-color);
  transform:scale(1.02);
}
.entry-title {
  font-size:1.1em;
  font-weight:bold;
  color:var(--heading-color);
  text-decoration:none;
}
.heading {
  color:var(--heading-color);
  font-weight:bold;
  margin-top:6px;
}
.value {
  color:var(--value-color);
  margin-left:5px;
}
mark.highlight {
  background-color:var(--highlight-color);
  color:#000;
}
::selection {
  background:var(--highlight-color);
  color:#000;
}
.feed-entries::-webkit-scrollbar {
  width:8px;
}
.feed-entries::-webkit-scrollbar-thumb {
  background:var(--matrix-color);
  border-radius:4px;
}
</style>
</head>
<body>
<canvas id="matrix"></canvas>

<div class="container">
  <h1>BlackWall | Threat Intelligence | (OSINT)</h1>
  
  <div id="search-container">
    <button id="last-24h">Last 24 Hours</button>
    <button id="archive">Archive</button>
    <input type="text" id="search-box" placeholder="Search feeds...">
    <button id="search-submit">Search</button>
    <button id="clear-search">Clear</button>

    <!-- Theme button & dropdown -->
    <div style="position:relative;">
      <button id="theme-button">Theme: Matrix Teal ▼</button>
      <div id="theme-dropdown">
        <div data-theme="default">Matrix Teal</div>
        <div data-theme="corporate-dark">Corporate Dark</div>
        <div data-theme="corporate-light">Corporate Light</div>
      </div>
    </div>
  </div>

  <div id="button-bar" style="display:flex; gap:10px; margin-bottom:10px;">
    <button id="expand-all">Expand All</button>
    <button id="collapse-all">Collapse All</button>
  </div>

  <div id="feed-note">Titles can be clicked to view the source</div>
  <div id="search-status">No matches found</div>
  <div id="feeds-container"></div>
</div>

<script>
// MATRIX
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;
const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()*&^%'.split('');
const fontSize = 18;
const columns = Math.floor(width / fontSize);
const drops = Array(columns).fill(0);
let matrixColor = getComputedStyle(document.documentElement).getPropertyValue('--matrix-color').trim();

function drawMatrix(){
  // Convert hex bg-color to rgba for fade effect
  const bgColor = getComputedStyle(document.documentElement).getPropertyValue('--bg-color').trim();
  let fillColor = bgColor;
  if(bgColor.startsWith('#')){
    const r=parseInt(bgColor.slice(1,3),16);
    const g=parseInt(bgColor.slice(3,5),16);
    const b=parseInt(bgColor.slice(5,7),16);
    fillColor = `rgba(${r},${g},${b},0.05)`;
  }
  ctx.fillStyle = fillColor;
  ctx.fillRect(0,0,width,height);
  ctx.fillStyle = matrixColor;
  ctx.font=fontSize+'px monospace';
  for(let i=0;i<drops.length;i++){
    const text = letters[Math.floor(Math.random()*letters.length)];
    ctx.fillText(text,i*fontSize,drops[i]*fontSize);
    if(drops[i]*fontSize>height && Math.random()>0.975)drops[i]=0;
    drops[i]++;
  }
}
setInterval(drawMatrix,50);
window.addEventListener('resize',()=>{width=canvas.width=window.innerWidth;height=canvas.height=window.innerHeight;});

// ELEMENTS
const container = document.getElementById('feeds-container');
const searchBox = document.getElementById('search-box');

// 24H FEEDS
const feeds = {
  "Bleeping Computer": "bleeping.json",
  "The Hacker News": "hackernews.json",
  "CISA Advisories": "cisa.json",
  "Mandiant Reports": "mandiant.json",
  "Ransomware Live": "ransomware_live.json",
  "MITRE ATT&CK Actors": "mitre.json"
};

function addField(card,label,value){
  if(!value) return;
  const h=document.createElement('div'); h.className='heading'; h.textContent=label; card.appendChild(h);
  const v=document.createElement('div'); v.className='value'; v.textContent=value; card.appendChild(v);
}

async function loadFeedData(data, feedName){
  const panel=document.createElement('div'); panel.className='feed-panel';
  const header=document.createElement('div'); header.className='feed-header'; header.textContent=`${feedName} (${data.length})`;
  panel.appendChild(header);
  const entriesDiv=document.createElement('div'); entriesDiv.className='feed-entries';
  header.onclick=()=>{entriesDiv.style.display=entriesDiv.style.display==='block'?'none':'block';};

  data.forEach(entry=>{
    const card=document.createElement('div'); card.className='entry-card';
    const title=document.createElement('a'); title.className='entry-title'; title.href=entry.link||entry.mitre_url||'#'; title.target='_blank';
    title.textContent=entry.title||entry.actor_name||'No title'; card.appendChild(title);
    const pub=entry.published||entry.last_updated;
    if(pub) addField(card,'Published (UTC):',new Date(pub).toISOString().replace('T',' ').split('.')[0]+'Z');
    let summary=entry.summary||entry.description; if(summary) summary=summary.replace(/\.\.\.$/,''); if(summary)addField(card,'Summary:',summary);
    if(entry.aliases)addField(card,'Aliases:',entry.aliases);
    if(entry.techniques)addField(card,'Techniques:',entry.techniques);
    if(entry.attribution)addField(card,'Attribution:',entry.attribution);
    if(entry.country)addField(card,'Country:',entry.country);
    if(entry.website)addField(card,'Website:',entry.website);
    entriesDiv.appendChild(card);
  });
  panel.appendChild(entriesDiv); container.appendChild(panel);
}

// LOAD 24H
async function load24h(){
  container.innerHTML='';
  for(const [name,file] of Object.entries(feeds)){
    try{
      const res=await fetch(file); const data=await res.json();
      await loadFeedData(data,name);
    }catch(e){console.error(file,e);}
  }
}

// LOAD ARCHIVE
async function loadArchive(){
  container.innerHTML='';
  try{
    const res = await fetch('archives_index.json');
    const archives = await res.json();
    for(const [feedKey, files] of Object.entries(archives)){
      let merged = [];
      const seen = new Set();
      for(const file of files){
        const resFile = await fetch(file);
        const text = await resFile.text();
        const data = text.split(/\r?\n/).filter(Boolean).map(line=>JSON.parse(line));
        for(const entry of data){
          const key = (entry.title||entry.actor_name||'') + '|' + (entry.link||entry.mitre_url||'');
          if(!seen.has(key)){ merged.push(entry); seen.add(key); }
        }
      }
      await loadFeedData(merged, feedKey.charAt(0).toUpperCase() + feedKey.slice(1) + ' Archive');
    }
  }catch(e){console.error('Failed loading archives', e);}
}

// BUTTONS
document.getElementById('last-24h').addEventListener('click',load24h);
document.getElementById('archive').addEventListener('click',loadArchive);
document.getElementById('expand-all').addEventListener('click',()=>{document.querySelectorAll('.feed-entries').forEach(d=>d.style.display='block');});
document.getElementById('collapse-all').addEventListener('click',()=>{document.querySelectorAll('.feed-entries').forEach(d=>d.style.display='none');});

// SEARCH
async function searchFeeds(){
  const query=searchBox.value.trim().toLowerCase();
  if(!query) return load24h();
  const panels = document.querySelectorAll('.feed-panel');
  let anyMatch=false;
  panels.forEach(panel=>{
    const entriesDiv = panel.querySelector('.feed-entries');
    let panelHasMatch=false;
    entriesDiv.querySelectorAll('.entry-card').forEach(card=>{
      const text = card.textContent.toLowerCase();
      const isMatch = text.includes(query);
      card.style.display = isMatch?'block':'none';
      if(isMatch) panelHasMatch=true;
    });
    entriesDiv.style.display = panelHasMatch?'block':'none';
    if(panelHasMatch) anyMatch=true;
  });
  document.getElementById('search-status').style.display = anyMatch?'none':'block';
}
document.getElementById('search-submit').addEventListener('click',searchFeeds);
searchBox.addEventListener('keydown',e=>{if(e.key==='Enter') searchFeeds();});
document.getElementById('clear-search').addEventListener('click',()=>{searchBox.value='';searchFeeds();});

// THEMES
const themes = {
  "default": {
    "--bg-color": "#000",
    "--text-color": "#0ff",
    "--matrix-color": "#0ff",
    "--heading-color": "#6f6",
    "--value-color": "#afa",
    "--highlight-color": "#0ff",
    "--alert-color": "#f66",
    "--button-bg": "#0ff",
    "--button-text": "#060",
    "--input-bg": "#111",
    "--input-text": "#0ff",
    "--note-color": "#6f6"
  },
  "corporate-dark": {
    "--bg-color": "#000",
    "--text-color": "#e6e6e6",
    "--matrix-color": "#000",
    "--heading-color": "#ccc",
    "--value-color": "#999",
    "--highlight-color": "#ffcc00",
    "--alert-color": "#f66",
    "--button-bg": "#e6e6e6",
    "--button-text": "#000",
    "--input-bg": "#111",
    "--input-text": "#e6e6e6",
    "--note-color": "#ccc"
  },
  "corporate-light": {
    "--bg-color": "#f2f2f2",
    "--text-color": "#222",
    "--matrix-color": "#f2f2f2",
    "--heading-color": "#444",
    "--value-color": "#666",
    "--highlight-color": "#ffcc00",
    "--alert-color": "#f66",
    "--button-bg": "#222",
    "--button-text": "#fff",
    "--input-bg": "#fff",
    "--input-text": "#222",
    "--note-color": "#444"
  }
};

const themeButton = document.getElementById('theme-button');
const themeDropdown = document.getElementById('theme-dropdown');
themeButton.addEventListener('click',()=>{themeDropdown.style.display = themeDropdown.style.display==='block'?'none':'block';});
themeDropdown.querySelectorAll('div').forEach(item=>{
  item.addEventListener('click',()=> {
    const selectedTheme = themes[item.dataset.theme];
    for(let prop in selectedTheme) document.documentElement.style.setProperty(prop, selectedTheme[prop]);
    matrixColor = getComputedStyle(document.documentElement).getPropertyValue('--matrix-color').trim();
    themeButton.textContent = `Theme: ${item.textContent} ▼`;
    themeDropdown.style.display='none';
  });
});

// INIT
load24h();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlackWall | Threat Intelligence | (OSINT)</title>
<style>
:root {
  --bg-color: #000;
  --text-color: #0ff;
  --matrix-color: #0ff;
  --heading-color: #6f6;
  --value-color: #afa;
  --highlight-color: #0ff;
  --alert-color: #f66;
  --button-bg: #0ff;
  --button-text: #060;
  --panel-bg: rgba(0,0,0,0.7);
  --card-bg: rgba(0,0,0,0.8);
  --header-bg: #000;
  --note-color: #6f6;
  --search-bg: #111;
  --search-text: #0ff;
  --search-placeholder: #888;
}
body {margin:0; font-family:'Courier New', monospace; background:var(--bg-color); color:var(--text-color); overflow-x:hidden;}
canvas#matrix {position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; pointer-events:none;}
.container {max-width:1200px; margin:20px auto; padding:10px; position:relative; z-index:1;}
h1 {color:var(--text-color); text-align:center; font-size:2em; text-shadow:0 0 5px var(--text-color),0 0 10px var(--text-color);}
#search-container {display:flex; flex-wrap:wrap; gap:10px; margin-bottom:10px; align-items:center;}
#search-box {flex:1; padding:10px; font-size:1em; background:var(--search-bg); border:1px solid var(--text-color); color:var(--search-text);}
#search-box::placeholder {color: var(--search-placeholder);}
button {background:var(--button-bg); color:var(--button-text); border:none; padding:5px 10px; cursor:pointer; font-weight:bold; border-radius:3px;}
#theme-button {position:relative;}
#theme-dropdown {display:none; position:absolute; top:100%; left:0; background:var(--panel-bg); border:1px solid var(--text-color); border-radius:3px; z-index:2;}
#theme-dropdown button {display:block; width:100%; text-align:left; margin:0; border:none; border-bottom:1px solid var(--text-color); border-radius:0;}
#feed-note {color:var(--note-color); font-size:0.9em; margin-bottom:10px; text-align:center;}
#search-status {text-align:center; color:var(--alert-color); font-weight:bold; margin-bottom:10px; display:none;}
.feed-panel {margin-bottom:20px; border:1px solid var(--text-color); border-radius:5px; overflow:hidden; background:var(--panel-bg); box-shadow:0 0 10px var(--text-color);}
.feed-header {padding:10px; background:var(--header-bg); cursor:pointer; font-weight:bold; font-size:1.2em; text-shadow:0 0 5px var(--text-color);}
.feed-entries {display:none; padding:10px; max-height:500px; overflow-y:auto;}
.entry-card {background:var(--card-bg); border:1px solid var(--text-color); padding:10px; margin-bottom:10px; border-radius:5px; transition:0.3s;}
.entry-card:hover {box-shadow:0 0 10px var(--text-color); transform:scale(1.02);}
.entry-title {font-size:1.1em; font-weight:bold; color:var(--heading-color); text-decoration:none;}
.heading {color:var(--heading-color); font-weight:bold; margin-top:6px;}
.value {color:var(--value-color); margin-left:5px;}
mark.highlight {background-color:var(--highlight-color); color:#000;}
::selection {background:var(--highlight-color); color:#000;}
.feed-entries::-webkit-scrollbar {width:8px;}
.feed-entries::-webkit-scrollbar-thumb {background:var(--matrix-color); border-radius:4px;}
</style>
</head>
<body>
<canvas id="matrix"></canvas>

<div class="container">
  <h1>BlackWall | Threat Intelligence | (OSINT)</h1>
  <div id="search-container">
    <button id="last-24h">Last 24 Hours</button>
    <button id="archive">Archive</button>
    <input type="text" id="search-box" placeholder="Search feeds...">
    <button id="search-submit">Search</button>
    <button id="clear-search">Clear</button>
    <div id="theme-button">
      <button id="theme-current">Theme: Matrix Teal ▼</button>
      <div id="theme-dropdown">
        <button data-theme="default">Matrix Teal</button>
        <button data-theme="corporate-dark">Corporate Dark</button>
        <button data-theme="corporate-light">Corporate Light</button>
      </div>
    </div>
  </div>

  <div id="button-bar" style="display:flex; gap:10px; margin-bottom:10px;">
    <button id="expand-all">Expand All</button>
    <button id="collapse-all">Collapse All</button>
  </div>

  <div id="feed-note">Titles can be clicked to view the source</div>
  <div id="search-status">No matches found</div>
  <div id="feeds-container"></div>
</div>

<script>
// MATRIX
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;
const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()*&^%'.split('');
const fontSize = 18;
const columns = Math.floor(width / fontSize);
const drops = Array(columns).fill(0);
let matrixColor = getComputedStyle(document.documentElement).getPropertyValue('--matrix-color').trim();

function hexToRgb(hex) {
  hex = hex.replace('#','');
  return {
    r: parseInt(hex.slice(0,2),16),
    g: parseInt(hex.slice(2,4),16),
    b: parseInt(hex.slice(4,6),16)
  };
}

function drawMatrix(){
  // Get theme bg color
  const bgHex = getComputedStyle(document.documentElement).getPropertyValue('--bg-color').trim();
  const {r,g,b} = hexToRgb(bgHex);
  ctx.fillStyle = `rgba(${r},${g},${b},0.05)`; // translucent background
  ctx.fillRect(0,0,width,height);

  matrixColor = getComputedStyle(document.documentElement).getPropertyValue('--matrix-color').trim();
  ctx.fillStyle = matrixColor;
  ctx.font = fontSize + 'px monospace';
  for(let i=0;i<drops.length;i++){
    const text = letters[Math.floor(Math.random()*letters.length)];
    ctx.fillText(text, i*fontSize, drops[i]*fontSize);
    if(drops[i]*fontSize>height && Math.random()>0.975) drops[i]=0;
    drops[i]++;
  }
}
setInterval(drawMatrix,50);
window.addEventListener('resize',()=>{width=canvas.width=window.innerWidth;height=canvas.height=window.innerHeight;});

// REST OF YOUR FEED & SEARCH LOGIC REMAINS THE SAME
// For brevity, I am not repeating all the feed-loading code here. It stays as in your original file.

// THEME SWITCHER (update matrix effect)
function applyTheme(name){
  const theme = themes[name];
  for(let prop in theme) document.documentElement.style.setProperty(prop, theme[prop]);
  matrixColor = getComputedStyle(document.documentElement).getPropertyValue('--matrix-color').trim();
  themeButton.textContent = 'Theme: ' + (name==='default'?'Matrix Teal':name==='corporate-dark'?'Corporate Dark':'Corporate Light') + ' ▼';
}

applyTheme('default'); // init default
load24h();
</script>
</body>
</html>
